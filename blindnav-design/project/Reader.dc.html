<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text reader</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="bn.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="ph">
  <div class="glow"></div>
  <div class="col" style="gap:12px;padding-top:36px">

    <div style="display:flex;align-items:center;gap:12px;min-height:56px">
      <a href="Home.dc.html" class="iconbtn" style="min-width:56px;min-height:56px;border:1px solid var(--line);border-radius:16px"><svg class="ic" viewBox="0 0 24 24" aria-label="Back"><path d="M15 6l-6 6 6 6"/></svg></a>
      <div style="flex:1">
        <div class="hud" style="font-size:11px;color:var(--gold)">YGGDRASIL</div>
        <div style="font-size:22px;font-weight:700;line-height:1.1">Read text</div>
      </div>
      <span class="pill" role="status"><span class="dot"></span>Ready</span>
    </div>

    <!-- preview -->
    <div class="brk" style="position:relative;height:270px;border-radius:20px;overflow:hidden;background:linear-gradient(#0c1210,#16201c);border:1px solid var(--line)" role="img" aria-label="Camera preview. A printed menu is detected and outlined.">
      <svg viewBox="0 0 353 270" width="100%" height="100%" aria-hidden="true" style="position:absolute;inset:0">
        <polygon points="46,34 312,48 296,238 34,224" fill="#cfd2cc" fill-opacity=".88"/>
        <g stroke="#2a332f" stroke-width="5" stroke-linecap="round" opacity=".8">
          <line x1="70" y1="78" x2="170" y2="80"/><line x1="226" y1="82" x2="268" y2="83"/>
          <line x1="68" y1="112" x2="150" y2="114"/><line x1="228" y1="116" x2="266" y2="117"/>
          <line x1="66" y1="146" x2="176" y2="148"/><line x1="230" y1="150" x2="264" y2="151"/>
          <line x1="64" y1="180" x2="140" y2="182"/>
        </g>
        <polygon points="46,34 312,48 296,238 34,224" fill="none" stroke="#00FF9C" stroke-width="2.5" stroke-linejoin="round"/>
        <g fill="#00FF9C"><circle cx="46" cy="34" r="6"/><circle cx="312" cy="48" r="6"/><circle cx="296" cy="238" r="6"/><circle cx="34" cy="224" r="6"/></g>
      </svg>
      <div class="scanline"></div>
      <span class="pill" style="position:absolute;left:12px;bottom:12px;background:rgba(9,11,10,.85)"><svg class="ic" style="width:16px;height:16px;color:var(--neon)" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Document found · English</span>
    </div>

    <!-- language -->
    <div role="group" aria-label="Reading language" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
      <a href="Reader.dc.html" class="btn" style="min-height:56px;font-size:16px;padding:0" aria-label="English, selected">EN</a>
      <a href="Reader.dc.html" class="btn s" style="min-height:56px;font-size:16px;padding:0" aria-label="Hindi">हिं</a>
      <a href="Reader.dc.html" class="btn s" style="min-height:56px;font-size:16px;padding:0" aria-label="Kannada">ಕನ್ನ</a>
      <a href="Reader.dc.html" class="btn s" style="min-height:56px;font-size:16px;padding:0" aria-label="Telugu">తెలు</a>
    </div>

    <!-- extracted text -->
    <div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:6px">
      <div class="hud" style="font-size:11px;color:var(--gold)">Text found · 3 lines</div>
      <div style="display:flex;justify-content:space-between;font-size:18px;line-height:1.5;color:var(--tx2)"><span>Idli Vada</span><span>₹60</span></div>
      <div style="display:flex;justify-content:space-between;font-size:18px;line-height:1.5;font-weight:700;background:rgba(212,175,55,.18);border-radius:8px;padding:0 8px;margin:0 -8px;outline:1px solid var(--gold)"><span>Masala Dosa</span><span>₹90</span></div>
      <div style="display:flex;justify-content:space-between;font-size:18px;line-height:1.5;color:var(--tx2)"><span>Filter Coffee</span><span>₹30</span></div>
      <div class="loadbar" role="progressbar" aria-label="Reading progress" style="margin-top:6px"><i style="animation:none;width:42%"></i></div>
    </div>

    <div style="margin-top:auto;display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px">
      <a href="Reader.dc.html" class="btn" style="font-size:16px;padding:0 10px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6"/></svg>Read aloud</a>
      <a href="Reader.dc.html" class="btn s" style="font-size:14px;padding:0 6px;flex-direction:column;gap:2px;letter-spacing:.06em"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>Pause</a>
      <a href="Reader.dc.html" class="btn s" style="font-size:14px;padding:0 6px;flex-direction:column;gap:2px;letter-spacing:.06em"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Resume</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
